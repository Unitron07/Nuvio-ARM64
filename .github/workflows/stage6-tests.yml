name: Stage 6 automation tests
on:
  pull_request:
    paths:
      - scripts/automation/**
      - scripts/windows/stage6/**
      - .github/workflows/**
      - STAGE6*.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python -m unittest discover -s scripts/automation -p 'test_*.py' -v
