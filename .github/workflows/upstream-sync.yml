name: Upstream synchronization proposals
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      upstream_repository:
        description: Official source repository
        default: NuvioMedia/NuvioDesktop
        type: string
      upstream_branch:
        description: Development branch
        default: Dev
        type: string
      upstream_tag:
        description: Optional exact upstream release tag (overrides development branch)
        type: string
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
concurrency:
  group: stage6-maintenance
  cancel-in-progress: false
jobs:
  propose:
    if: github.repository == 'Unitron07/Nuvio-ARM64' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run trusted downstream automation
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ inputs.upstream_repository || 'NuvioMedia/NuvioDesktop' }}
          UPSTREAM_BRANCH: ${{ inputs.upstream_branch || 'Dev' }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: python scripts/automation/downstream.py sync --upstream "$UPSTREAM" --branch "$UPSTREAM_BRANCH" --tag "$UPSTREAM_TAG"
